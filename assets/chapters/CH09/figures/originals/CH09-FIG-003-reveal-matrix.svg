<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Chronology and audience reveal are different orders</title><desc id="desc">事件時間與觀眾揭露順序並不相同</desc><style>text{font-family:Arial,sans-serif;fill:#242629}.title{font-size:29px;font-weight:700;letter-spacing:1px}.body{font-size:24px;font-weight:600}.small{font-size:19px;fill:#4c5050}.label{font-size:21px;font-weight:700;letter-spacing:2px}</style><rect width="1200" height="600" fill="#f7f3ec"/><text x="65" y="150" class="label">EVENT CHRONOLOGY</text><text x="65" y="350" class="label">REVEAL ORDER</text><path fill="none" d="M300 160H1100M300 360H1100" stroke="#b8aaa0" stroke-width="4"/><g fill="#315c5b"><circle cx="390" cy="160" r="17"/><circle cx="650" cy="160" r="17"/><circle cx="930" cy="160" r="17"/></g><g fill="#b64f38"><circle cx="390" cy="360" r="17"/><circle cx="650" cy="360" r="17"/><circle cx="930" cy="360" r="17"/></g><text x="390" y="120" text-anchor="middle" class="small">A: cause</text><text x="650" y="120" text-anchor="middle" class="small">B: choice</text><text x="930" y="120" text-anchor="middle" class="small">C: outcome</text><text x="390" y="415" text-anchor="middle" class="small">B</text><text x="650" y="415" text-anchor="middle" class="small">A (reframe)</text><text x="930" y="415" text-anchor="middle" class="small">C</text><path fill="none" d="M390 195C390 245 650 275 650 325M650 195C650 245 390 275 390 325M930 195V325" stroke="#7b7771" stroke-width="2" stroke-dasharray="6 7"/><text x="700" y="500" text-anchor="middle" class="small">Track what happened, what is shown, what is known, and what changes.</text></svg>