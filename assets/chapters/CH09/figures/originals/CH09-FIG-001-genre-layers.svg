<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Genre as a revisable set of promises</title><desc id="desc">類型是可修正的期待組合</desc><style>text{font-family:Arial,sans-serif;fill:#242629}.title{font-size:29px;font-weight:700;letter-spacing:1px}.body{font-size:24px;font-weight:600}.small{font-size:19px;fill:#4c5050}.label{font-size:21px;font-weight:700;letter-spacing:2px}</style><rect width="1200" height="600" fill="#f7f3ec"/><rect x="55" y="70" width="330" height="410" rx="32" fill="#efe6d5"/><rect x="435" y="70" width="330" height="410" rx="32" fill="#dce7e5"/><rect x="815" y="70" width="330" height="410" rx="32" fill="#e8dfeb"/><text x="220" y="150" text-anchor="middle" class="title">SEMANTICS</text><text x="600" y="150" text-anchor="middle" class="title">SYNTAX</text><text x="980" y="150" text-anchor="middle" class="title">PRAGMATICS</text><text x="220" y="230" text-anchor="middle" class="body">recognisable materials</text><text x="220" y="280" text-anchor="middle" class="small">roles · settings · objects</text><text x="600" y="230" text-anchor="middle" class="body">relations and patterns</text><text x="600" y="280" text-anchor="middle" class="small">causality · tone · resolution</text><text x="980" y="230" text-anchor="middle" class="body">historical context</text><text x="980" y="280" text-anchor="middle" class="small">industry · audience · use</text><path fill="none" d="M385 300H430M765 300H810" stroke="#b64f38" stroke-width="7"/><text x="600" y="395" text-anchor="middle" class="body">a working promise, open to change</text><text x="600" y="440" text-anchor="middle" class="small">not a fixed checklist or genre law</text></svg>