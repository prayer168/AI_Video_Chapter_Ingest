  caption_zh: 圖 8-2｜潛台詞分析要從字面台詞回到行為和語境證據，也要保留不同觀眾的合理讀法。本圖為本書原創可編輯 SVG 示意圖，非電影劇照或特定電影鏡頭；權利與出版核准待審。
  caption_en: Figure 8-2. Subtext analysis should return from literal speech to behavioral
    and contextual evidence while preserving reasonable differences in audience interpretation.
    This is an original editable SVG illustration for this book, not a film still
    or a depiction of a specific film shot; rights and publication approval pending.
  alt_zh: 原創同心弧線圖呈現字面發話、可觀察行動與聲音、場景脈絡及觀眾推論四層；潛台詞假設需回指線索，並容許多種讀法。
  alt_en: An original nested-arc diagram presents four layers—literal speech, observable
    behavior and sound, scene context, and audience inference. Subtext hypotheses
    point back to cues and allow multiple readings.
