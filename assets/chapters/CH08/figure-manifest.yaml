  caption_zh: 圖 8-1｜場景節拍可作為行動／反應與狀態改變的分析註記，不能當固定公式。本圖為本書原創可編輯 SVG 示意圖，非電影劇照或特定電影鏡頭；權利與出版核准待審。
  caption_en: Figure 8-1. Scene beats can annotate action/reaction and state changes;
    they are not a fixed formula. This is an original editable SVG illustration for
    this book, not a film still or a depiction of a specific film shot; rights and
    publication approval pending.
  alt_zh: 原創向量流程圖把場景狀態連到行動與反應；只有目標、策略、資訊或關係出現可辨認變化時才標記節拍，並回到新的場景狀態。
  alt_en: An original vector flow diagram connects scene state to action and response;
    mark a beat only when objective, tactic, information, or relationship changes
    observably, then return to a new scene state.
