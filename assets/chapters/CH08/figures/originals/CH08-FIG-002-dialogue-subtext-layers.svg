<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Dialogue and subtext / 對白與潛台詞</title><desc id="desc">Literal speech, behavior, context, and audience inference linked by evidence / 字面發話、行為、脈絡和觀眾推論由證據連結。</desc><text x="70" y="70" font-family="Arial,sans-serif" font-size="31" fill="#26363c">READ THE WORDS WITH THE SCENE / 連同場景閱讀台詞</text><g fill="none" stroke-width="38"><path d="M270 440A330 330 0 0 1 930 440" stroke="#ead9c8"/><path d="M330 440A270 270 0 0 1 870 440" stroke="#d5e1dc"/><path d="M395 440A205 205 0 0 1 805 440" stroke="#eccba6"/><path d="M465 440A135 135 0 0 1 735 440" stroke="#b9c9c1"/></g><g font-family="Arial,sans-serif" font-size="22" fill="#26363c" text-anchor="middle"><text x="600" y="490">literal speech / 字面發話</text><text x="600" y="375">action + sound / 行動＋聲音</text><text x="600" y="278">scene context / 場景脈絡</text><text x="600" y="174">audience inference / 觀眾推論</text></g><path d="M250 530C405 585 795 585 950 530" fill="none" stroke="#b85f3c" stroke-width="3"/><text x="600" y="605" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#8b4c35">Evidence supports hypotheses; multiple readings may remain / 線索支持假設；可保留多種讀法</text></svg>