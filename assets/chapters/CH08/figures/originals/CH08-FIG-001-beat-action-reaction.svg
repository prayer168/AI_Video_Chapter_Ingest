<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Scene beat flow / 場景節拍流程</title><desc id="desc">Scene state, action, response, and evidence-based change / 場景狀態、行動、反應與有證據的變化。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#b85f3c" stroke-width="2"/></marker></defs><text x="70" y="70" font-family="Arial,sans-serif" font-size="31" fill="#26363c">SCENE / 場景 — ACTION / 行動 — RESPONSE / 反應</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="160" cy="250" r="82" fill="#ead9c8"/><text x="160" y="243" font-size="23" fill="#26363c">STATE</text><text x="160" y="276" font-size="20" fill="#26363c">狀態</text><circle cx="450" cy="250" r="82" fill="#d5e1dc"/><text x="450" y="243" font-size="23" fill="#26363c">ACTION</text><text x="450" y="276" font-size="20" fill="#26363c">行動</text><circle cx="740" cy="250" r="82" fill="#ead9c8"/><text x="740" y="243" font-size="23" fill="#26363c">RESPONSE</text><text x="740" y="276" font-size="20" fill="#26363c">反應</text><circle cx="1030" cy="250" r="82" fill="#d5e1dc"/><text x="1030" y="243" font-size="23" fill="#26363c">CHANGE?</text><text x="1030" y="276" font-size="20" fill="#26363c">有變化？</text></g><g stroke="#b85f3c" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M248 250H350"/><path d="M538 250H640"/><path d="M828 250H930"/></g><path d="M1030 346C1000 460 210 460 160 346" fill="none" stroke="#71847d" stroke-width="3" stroke-dasharray="10 9" marker-end="url(#arrow)"/><text x="600" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#526b64">Mark a beat only when evidence supports change / 有證據才標新節拍</text></svg>