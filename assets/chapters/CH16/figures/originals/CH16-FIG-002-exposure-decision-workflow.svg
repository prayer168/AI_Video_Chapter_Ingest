<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
<title id="title">Exposure decision and verification workflow</title><desc id="desc">An original bilingual six-step workflow prioritizes story information, measures contrast, chooses capture settings, tests and verifies the signal, then logs and hands off results.</desc>
<defs><style>.bg{fill:#111820}.head{fill:#e8d8b6;font:700 30px sans-serif}.sub{fill:#bfcbd0;font:17px sans-serif}.box{fill:#1d2a34;stroke:#d4a45f;stroke-width:2}.label{fill:#f4f1e9;font:22px sans-serif}.small{fill:#c8d2d5;font:17px sans-serif}.arrow{stroke:#d4a45f;stroke-width:4;fill:none;marker-end:url(#arr)}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a45f"/></marker></defs>
<rect class="bg" width="1400" height="820"/><text x="70" y="65" class="head">曝光決策與驗證 Exposure Decision &amp; Verification</text><text x="70" y="98" class="sub">A production checklist, not a universal camera-menu sequence.</text>
<g class="box"><rect x="80" y="160" width="350" height="145" rx="18"/><rect x="525" y="160" width="350" height="145" rx="18"/><rect x="970" y="160" width="350" height="145" rx="18"/><rect x="970" y="460" width="350" height="145" rx="18"/><rect x="525" y="460" width="350" height="145" rx="18"/><rect x="80" y="460" width="350" height="145" rx="18"/></g>
<g class="label" text-anchor="middle"><text x="255" y="210"><tspan x="255">1. 故事優先資訊</tspan><tspan x="255" dy="31">Narrative priorities</tspan></text><text x="700" y="210"><tspan x="700">2. 場景反差</tspan><tspan x="700" dy="31">Scene contrast</tspan></text><text x="1145" y="210"><tspan x="1145">3. 拍攝條件</tspan><tspan x="1145" dy="31">Capture conditions</tspan></text><text x="1145" y="510"><tspan x="1145">4. 測光與測試格</tspan><tspan x="1145" dy="31">Meter &amp; test frames</tspan></text><text x="700" y="510"><tspan x="700">5. 訊號交叉檢查</tspan><tspan x="700" dy="31">Cross-check signal</tspan></text><text x="255" y="510"><tspan x="255">6. 紀錄與交接</tspan><tspan x="255" dy="31">Log &amp; handoff</tspan></text></g>
<path d="M435 232H510M880 232H955M1145 315V445M955 532H890M510 532H445" class="arrow"/><path d="M255 615V690H700V625" class="arrow"/><text x="700" y="740" class="small" text-anchor="middle">缺少證據時標示 unknown；監看參考、機型與版本須一併記錄。</text><text x="700" y="770" class="small" text-anchor="middle">When evidence is missing, use unknown; log the monitor reference, camera model, and version.</text>
</svg>
