<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc"><title id="title">Pan and truck / 搖攝與橫移</title><desc id="desc">Pan rotates around a stationary position; truck translates the camera laterally.</desc><rect width="1100" height="560" fill="#f4f0e8"/><text x="55" y="65" font-size="32" font-family="sans-serif">Pan 原地轉向；Truck 橫向改變機位</text><text x="55" y="104" font-size="22" font-family="sans-serif">Rotation in place versus lateral camera translation.</text><g stroke="#202629" stroke-width="4" fill="none"><path d="M90 420h380M610 420h390"/><path d="M240 390V205M760 390V205"/><path d="M240 220l-75-80m75 80 75-80"/><path d="M760 220l130-45"/></g><g fill="#202629"><path d="M210 345h60l25 30v40h-85z"/><path d="M675 345h60l25 30v40h-85z"/></g><g stroke="#bf7654" stroke-width="6" fill="none"><path d="M120 310A150 150 0 0 1 360 180"/><path d="M675 455h180"/></g><g font-family="sans-serif" font-size="24" fill="#202629"><text x="110" y="490">PAN: fixed camera position; rotate head</text><text x="610" y="490">TRUCK: translate camera sideways</text></g></svg>
