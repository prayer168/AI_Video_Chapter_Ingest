<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">180 degree axis / 180 度軸線</title><desc id="desc">Two actors define an action axis; camera positions on one side preserve screen direction by convention.</desc><rect width="1000" height="700" fill="#f4f0e8"/><text x="55" y="65" font-size="32" font-family="sans-serif">先建立動作軸，再選擇攝影機側</text><text x="55" y="105" font-size="22" font-family="sans-serif">Establish the action axis, then choose a camera side.</text><path d="M210 360H790" stroke="#202629" stroke-width="5"/><text x="440" y="340" font-size="22" font-family="sans-serif">動作軸 / action axis</text><circle cx="260" cy="360" r="40" fill="#bf7654"/><circle cx="740" cy="360" r="40" fill="#c59b45"/><text x="245" y="370" font-size="22">A</text><text x="725" y="370" font-size="22">B</text><path d="M250 150H750V320H250Z" fill="#d6dfd8" opacity=".8"/><text x="380" y="205" font-size="24" font-family="sans-serif">慣例使用側 / conventional side</text><g fill="#202629"><path d="M355 260h60l20 25v35h-80z"/><path d="M575 260h60l20 25v35h-80z"/></g><path d="M500 390v190" stroke="#bf7654" stroke-width="4" stroke-dasharray="10 10"/><text x="520" y="520" font-size="22" font-family="sans-serif">跨軸須重新定位觀眾 / crossing needs reorientation</text><text x="55" y="645" font-size="18" font-family="sans-serif">連戲慣例而非絕對禁令。 / A continuity convention, not an absolute prohibition.</text></svg>
