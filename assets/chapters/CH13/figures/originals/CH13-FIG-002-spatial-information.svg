<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
 <title id="title">Spatial design changes visible information</title>
 <desc id="desc">Two original floor-plan options compare a doorway occlusion with an open sightline and show camera directions.</desc>
 <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bb4d35"/></marker></defs>
 <rect width="1200" height="660" fill="#f5f0e7"/><text x="48" y="55" font-family="sans-serif" font-size="27" fill="#20313b">One room, two information designs</text>
 <g transform="translate(45 95)"><text x="20" y="28" font-family="sans-serif" font-size="23" fill="#20313b">A · Partial reveal</text><rect x="20" y="55" width="500" height="410" fill="#ebe3d4" stroke="#263943" stroke-width="8"/><rect x="245" y="210" width="45" height="255" fill="#5d6670"/><text x="232" y="492" font-family="sans-serif" font-size="16" fill="#263943">doorway wall</text><circle cx="380" cy="300" r="26" fill="#315b76"/><text x="340" y="350" font-family="sans-serif" font-size="16" fill="#263943">Person B</text><circle cx="125" cy="365" r="26" fill="#bb4d35"/><text x="82" y="414" font-family="sans-serif" font-size="16" fill="#263943">Person A</text><path d="M150 355L230 300" stroke="#bb4d35" stroke-width="5" stroke-dasharray="8 8" marker-end="url(#a)"/><path d="M80 200L215 275L130 285Z" fill="#7ca3a4" opacity=".55"/><path d="M125 160L145 198L105 198Z" fill="#263943"/><text x="94" y="148" font-family="sans-serif" font-size="14" fill="#263943">Camera</text><text x="42" y="440" font-family="sans-serif" font-size="15" fill="#59636a">A’s view is partly blocked;</text><text x="42" y="460" font-family="sans-serif" font-size="15" fill="#59636a">B is revealed later.</text></g>
 <g transform="translate(635 95)"><text x="20" y="28" font-family="sans-serif" font-size="23" fill="#20313b">B · Open sightline</text><rect x="20" y="55" width="500" height="410" fill="#ebe3d4" stroke="#263943" stroke-width="8"/><circle cx="380" cy="300" r="26" fill="#315b76"/><text x="340" y="350" font-family="sans-serif" font-size="16" fill="#263943">Person B</text><circle cx="125" cy="365" r="26" fill="#bb4d35"/><text x="82" y="414" font-family="sans-serif" font-size="16" fill="#263943">Person A</text><path d="M150 355L350 305" stroke="#bb4d35" stroke-width="5" stroke-dasharray="8 8" marker-end="url(#a)"/><path d="M80 200L410 285L130 285Z" fill="#7ca3a4" opacity=".38"/><path d="M125 160L145 198L105 198Z" fill="#263943"/><text x="94" y="148" font-family="sans-serif" font-size="14" fill="#263943">Camera</text><text x="42" y="440" font-family="sans-serif" font-size="15" fill="#59636a">Both performers are visible;</text><text x="42" y="460" font-family="sans-serif" font-size="15" fill="#59636a">the exchange is explicit.</text></g>
 <text x="48" y="620" font-family="sans-serif" font-size="15" fill="#59636a">Original schematic comparison. The illustrated effects are possibilities, not fixed emotional meanings.</text>
</svg>
