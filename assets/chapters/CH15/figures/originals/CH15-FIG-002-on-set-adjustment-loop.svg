<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">On-set adjustment decision loop / 現場修正決策循環</title>
<desc id="desc">An original editable diagram: detect a change, protect story and safety priorities, compare options, align departments, record a new version, and review footage. 原創可編輯流程圖：辨識變動、確認故事與安全優先事項、比較方案、部門協作、記錄版本並檢視素材。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b58b55"/></marker></defs>
<rect width="1200" height="620" fill="#f4f0e8"/><text x="55" y="58" font-family="sans-serif" font-size="28" fill="#202a33">現場修正：保留意圖、同步資訊｜On-set adjustment: preserve intent, synchronize information</text>
<g font-family="sans-serif" text-anchor="middle" fill="#202a33" stroke="#b58b55" stroke-width="3">
<rect x="70" y="145" width="230" height="115" rx="22" fill="#fffaf0"/><text x="185" y="190" stroke="none" font-size="21">辨識變動</text><text x="185" y="225" stroke="none" font-size="17">Detect change</text>
<rect x="365" y="145" width="230" height="115" rx="22" fill="#fffaf0"/><text x="480" y="190" stroke="none" font-size="20">確認故事／安全邊界</text><text x="480" y="225" stroke="none" font-size="17">Story + safety priorities</text>
<rect x="660" y="145" width="230" height="115" rx="22" fill="#fffaf0"/><text x="775" y="190" stroke="none" font-size="21">比較可行方案</text><text x="775" y="225" stroke="none" font-size="17">Compare options</text>
<rect x="955" y="145" width="190" height="115" rx="22" fill="#fffaf0"/><text x="1050" y="190" stroke="none" font-size="21">部門確認</text><text x="1050" y="225" stroke="none" font-size="17">Align departments</text>
<path d="M300 200 H355 M595 200 H650 M890 200 H945" fill="none" marker-end="url(#arrow)"/>
<rect x="365" y="390" width="230" height="115" rx="22" fill="#e7e0d4"/><text x="480" y="435" stroke="none" font-size="21">記錄新版本</text><text x="480" y="470" stroke="none" font-size="17">Log new version</text>
<rect x="660" y="390" width="230" height="115" rx="22" fill="#e7e0d4"/><text x="775" y="435" stroke="none" font-size="21">回看素材與連戲</text><text x="775" y="470" stroke="none" font-size="17">Review footage + continuity</text>
<path d="M1050 260 V330 H780 V380 M660 448 H605" fill="none" marker-end="url(#arrow)"/><path d="M365 448 H180 V300 H185 V270" fill="none" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
</g><text x="55" y="575" font-family="sans-serif" font-size="17" fill="#505b64">示意流程；合資格人員、安全程序及當地規範優先。 Schematic only; qualified personnel, safety procedures, and local rules govern.</text>
</svg>
