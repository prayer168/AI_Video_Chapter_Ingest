- term_id: TERM-CH12-PERFORMANCE-CONTINUITY
  preferred:
    zh-TW: 表演連續性
    en-US: performance continuity
  definitions:
    zh-TW: 比對跨鏡頭、take 或非順拍場次的表演、動作、語速、視線和道具互動。
    en-US: Comparing performance, movement, pace, eyelines, and prop interaction across shots, takes,
      or scenes shot out of order.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R088
