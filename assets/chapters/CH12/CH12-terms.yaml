- term_id: TERM-CH12-MOVEMENT-BEAT
  preferred:
    zh-TW: 動作節拍
    en-US: movement beat
  definitions:
    zh-TW: 具有戲劇功能、可觀察的行動變化，如接近、阻擋或退讓。
