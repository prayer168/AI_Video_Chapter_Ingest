- term_id: TERM-CH12-ACTION-MATCH
  preferred:
    zh-TW: 動作銜接
    en-US: match on action
  definitions:
    zh-TW: 以相鄰鏡頭中同一動作的連續部分建立時間與空間連接。
    en-US: Connecting adjacent shots through continuous portions of the same action to establish temporal
      and spatial flow.
  status: draft
  reviewed_by: null
