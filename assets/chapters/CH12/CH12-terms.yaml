- term_id: TERM-CH12-SCREEN-DIRECTION
  preferred:
    zh-TW: 畫面方向
    en-US: screen direction
  definitions:
    zh-TW: 人物在畫面中的移動方向；維持或改變皆須考慮空間和剪輯意圖。
    en-US: A character’s direction of movement in frame; continuity or change should account for space
      and editorial intent.
