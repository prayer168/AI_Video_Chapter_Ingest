- term_id: TERM-CH12-BLOCKING
  preferred:
    zh-TW: 演員調度／走位設計
    en-US: actor blocking
  definitions:
    zh-TW: 為表演與攝影安排人物、物件和鏡頭在場景空間中的行動關係，不只是地板標記。
    en-US: Arranging performers, objects, and camera movement in scene space for dramatic and photographic
      purposes; more than floor marks.
  status: draft
