<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Continuity handoff record</title><desc id="desc">A continuity handoff compares script and scene version, movement and eyeline, prop state, camera and slate, and recorded variation decisions.</desc><rect width="1200" height="600" fill="#f5f1e9"/><text x="600" y="52" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#18232a">連續性紀錄與交接 / Continuity record and handoff</text><g font-family="sans-serif"><rect x="60" y="100" width="1080" height="68" fill="#233b43"/><g fill="#fff" font-size="19" text-anchor="middle"><text x="170" y="141">欄位 / Field</text><text x="600" y="141">記錄 / Record</text><text x="990" y="141">剪輯檢核 / Editorial check</text></g><g stroke="#aeb7b0" stroke-width="2" fill="#fff"><rect x="60" y="168" width="1080" height="74"/><rect x="60" y="242" width="1080" height="74"/><rect x="60" y="316" width="1080" height="74"/><rect x="60" y="390" width="1080" height="74"/><rect x="60" y="464" width="1080" height="74"/><path d="M280 168v370M820 168v370"/></g><g fill="#26343a" font-size="18"><text x="85" y="212">劇本／場景版本</text><text x="305" y="212">版號、場景 ID、日期</text><text x="845" y="212">版本是否一致？</text><text x="85" y="286">動作／視線</text><text x="305" y="286">動作起訖、對象、方向、高度</text><text x="845" y="286">接點是否可剪？</text><text x="85" y="360">道具狀態</text><text x="305" y="360">持有人、拿放、起始狀態</text><text x="845" y="360">差異有意義嗎？</text><text x="85" y="434">攝影／場記</text><text x="305" y="434">機位、鏡頭、take／slate</text><text x="845" y="434">資料可追溯嗎？</text><text x="85" y="508">變化決策</text><text x="305" y="508">變化、理由、通知對象</text><text x="845" y="508">差異是否保留？</text></g></g></svg>