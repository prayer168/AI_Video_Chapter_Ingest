<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
<title id="title">Film unit hierarchy teaching model</title><desc id="desc">Film, sequence, scene, shot, and frame are shown as a teaching sequence, not a universal strict nesting rule.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#365b73"/></marker></defs>
<rect width="1000" height="190" rx="18" fill="#f3f7fa"/>
<g font-family="Noto Sans CJK TC, Microsoft JhengHei, sans-serif" text-anchor="middle" fill="#183247">
<g><rect x="24" y="48" width="150" height="72" rx="12" fill="#d9eaf3"/><text x="99" y="78" font-size="20">Film</text><text x="99" y="103" font-size="14">電影</text></g>
<g><rect x="222" y="48" width="150" height="72" rx="12" fill="#d9eaf3"/><text x="297" y="78" font-size="20">Sequence</text><text x="297" y="103" font-size="14">敘事段落</text></g>
<g><rect x="420" y="48" width="150" height="72" rx="12" fill="#d9eaf3"/><text x="495" y="78" font-size="20">Scene</text><text x="495" y="103" font-size="14">場景／一場戲</text></g>
<g><rect x="618" y="48" width="150" height="72" rx="12" fill="#d9eaf3"/><text x="693" y="78" font-size="20">Shot</text><text x="693" y="103" font-size="14">鏡頭</text></g>
<g><rect x="816" y="48" width="150" height="72" rx="12" fill="#d9eaf3"/><text x="891" y="78" font-size="20">Frame</text><text x="891" y="103" font-size="14">影格</text></g>
<path d="M178 84H213 M376 84H411 M574 84H609 M772 84H807" stroke="#365b73" stroke-width="3" marker-end="url(#arrow)"/>
<text x="500" y="158" font-size="14">教學模型：實際作品的組織方式可能不同</text>
</g></svg>