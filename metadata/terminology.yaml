  reviewed_on: null
- term_id: TERM-CH01-FRAME-WITHIN-FRAME
  preferred:
    zh-TW: 框中框構圖
    en-US: Frame within a frame
  definitions:
    zh-TW: 利用門、窗或其他畫面內邊界形成次級框景，改變可見範圍、遮擋或空間層次。
    en-US: A doorway, window, or other in-frame boundary creates a secondary frame that changes visibility, occlusion,
      or spatial layering.
  domain: composition
  context: CH01 film-homage case studies; draft definition, not approved.
  synonyms:
    zh-TW: []
    en-US: []
