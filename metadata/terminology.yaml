schema_version: 1
terms:
- term_id: TERM-CH01-DEEP-FOCUS
  preferred:
    zh-TW: 深焦攝影
    en-US: Deep focus
  definitions:
    zh-TW: 同一鏡頭中，前景與背景等不同距離的元素可同時保持可辨識的清晰度；效果受光學、光圈、照明、感光材料及觀看條件影響。
    en-US: A shot in which elements at different distances, including foreground and background, remain legibly
      sharp; results depend on optics, aperture, lighting, capture medium, and viewing conditions.
  domain: film-form analysis
  context: CH01 film-homage case studies; draft definition, not approved.
  synonyms:
    zh-TW: []
    en-US: []
  see_also: []
- term_id: TERM-CH07-CHARACTER
  preferred:
    zh-TW: 角色
    en-US: character
  definitions:
    zh-TW: 敘事中可由身體、社會位置、行動、情緒、特質或思想等線索辨認與建構的人物；使用面向依作品而定。
    en-US: A figure in a narrative constructed through cues such as body, social position, action, emotion, traits,
      or thought; relevant dimensions vary by work.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R052
  domain: film narrative
  context: CH07 working definition; pending terminology review.
  synonyms:
    zh-TW: []
    en-US: []
  see_also:
  - TERM-CH07-CHARACTERIZATION
- term_id: TERM-CH07-CHARACTERIZATION
  preferred:
    zh-TW: 人物塑造
    en-US: characterization
  definitions:
    zh-TW: 作品透過行動、反應、外貌、聲音、關係與資訊安排，使觀眾推論人物的過程。
    en-US: The process by which a work invites viewers to infer a person through action, reaction, appearance, voice,
      relationships, and information.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R052
  domain: film narrative
  context: CH07 working definition; pending terminology review.
  synonyms:
    zh-TW: []
    en-US: []
  see_also:
  - TERM-CH07-CHARACTER
- term_id: TERM-CH07-GOAL
  preferred:
    zh-TW: 角色目標
    en-US: character goal
  definitions:
    zh-TW: 角色在特定情境中想取得、避免或完成的可表述結果，應能由行動與結果觀察。
    en-US: A describable outcome a character seeks, avoids, or completes in a particular situation, observable through
      action and result.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R053
  domain: screenwriting
  context: CH07 working definition; pending terminology review.
  synonyms:
    zh-TW: []
    en-US: []
  see_also:
  - TERM-CH07-DESIRE
- term_id: TERM-CH07-DESIRE
  preferred:
    zh-TW: 欲望／戲劇需求
    en-US: desire / dramatic need
  definitions:
    zh-TW: 本章以欲望指推動角色行動的追求；dramatic need 依 Syd Field 的特定用法，不等同所有流派的內在需要。
    en-US: This chapter uses desire for a pursuit driving action; “dramatic need” follows Syd Field's specific usage
      and is not equivalent to every school's inner need.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R053
  domain: screenwriting
  context: Distinction is provisional; terminology editor review required.
  synonyms:
    zh-TW: []
    en-US: []
  see_also:
  - TERM-CH07-GOAL
- term_id: TERM-CH07-OBSTACLE
  preferred:
    zh-TW: 阻力
    en-US: obstacle
  definitions:
    zh-TW: 妨礙角色直接達成目標的條件、他人意圖、制度限制或角色策略。
    en-US: A condition, another person's intention, institutional limit, or character strategy that prevents direct
      achievement of a goal.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R054
  domain: screenwriting
  context: CH07 working definition; pending terminology review.
  synonyms:
    zh-TW: []
    en-US: []
  see_also:
  - TERM-CH07-CONFLICT
- term_id: TERM-CH07-CONFLICT
  preferred:
    zh-TW: 衝突
    en-US: conflict
  definitions:
    zh-TW: 不相容的目標、價值或行動在具體情境中相遇，迫使選擇並造成可觀察後果。
    en-US: Incompatible goals, values, or actions meet in a concrete situation, forcing a choice and producing observable
      consequences.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R054
  domain: screenwriting
  context: CH07 operational working definition; pending review.
  synonyms:
    zh-TW: []
    en-US: []
  see_also:
  - TERM-CH07-OBSTACLE
- term_id: TERM-CH07-CHARACTER-ARC
  preferred:
    zh-TW: 角色弧線
    en-US: character arc
  definitions:
    zh-TW: 角色在故事中的信念、策略、關係或行動模式所呈現的變化；亦可呈現退化、循環、拒變或穩定。
    en-US: Change in a character's beliefs, strategies, relationships, or patterns of action; may also involve deterioration,
      recurrence, refusal, or stability.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R052
  - R055
  domain: film narrative
  context: CH07 working definition; not a requirement that every protagonist change.
  synonyms:
    zh-TW: []
    en-US: []
  see_also:
  - TERM-CH07-CHARACTER-AGENCY
- term_id: TERM-CH07-CHARACTER-AGENCY
  preferred:
    zh-TW: 角色能動性
    en-US: character agency
  definitions:
    zh-TW: 角色在限制下作出選擇並影響後續事件的程度；應同時辨識結構限制與選擇代價。
    en-US: The degree to which a character makes choices under constraint and affects later events; identify structural
      limits and the costs of available choices.
  status: draft
  reviewed_by: null
  reviewed_on: null
  references:
  - R013
  - R020
  domain: film narrative
  context: CH07 working definition; not equivalent to unrestricted freedom.
  synonyms:
    zh-TW: []
    en-US: []
  see_also:
  - TERM-CH07-CHARACTER-ARC
- term_id: TERM-CH01-MULTIPLE-PERSPECTIVE
  preferred:
    zh-TW: 多重觀點敘事
    en-US: Multiple perspectives
  definitions:
    zh-TW: 透過不同人物或資訊範圍呈現同一事件的不同觀點；觀點不同本身不能證明敘述者說謊。
    en-US: Different characters or information ranges present an event from distinct viewpoints; difference alone
      does not prove that a narrator is lying.
  domain: narrative analysis
  context: CH01 film-homage case studies; draft definition, not approved.
  synonyms:
    zh-TW: []
    en-US: []
  see_also: []
  references:
  - R014
  status: draft
  reviewed_by: null
  reviewed_on: null
- term_id: TERM-CH01-OFFSCREEN-SPACE
  preferred:
    zh-TW: 畫外空間
    en-US: Offscreen space
  definitions:
    zh-TW: 畫框之外但可由聲音、視線、動作或剪輯關係被觀眾推知的空間。
    en-US: Space beyond the frame that viewers may infer through sound, eyelines, movement, or editing relations.
  domain: film space
  context: CH01 film-homage case studies; draft definition, not approved.
  synonyms:
