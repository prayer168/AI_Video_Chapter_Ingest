figures:
  - figure_id: CH01-HOMAGE-FIG-001
    caption_zh: 原創虛構教室示意圖，以前景、中景與背景人物說明不同距離的資訊層次；不是《公民凱恩》劇照，圖檔尚未製作。
    caption_en: An original fictional-classroom diagram uses foreground, middle-ground, and background figures to explain information across depth planes. It is not a still from Citizen Kane; no image file has been made.
    status: brief-only-needs-creation-and-review
  - figure_id: CH01-HOMAGE-FIG-002
    caption_zh: 原創三視點平面圖標示攝影機、視線與各角色可見範圍；不使用《羅生門》畫面，圖檔尚未製作。
    caption_en: An original three-viewpoint floor plan marks cameras, eyelines, and each character’s visible area. It uses no Rashomon imagery; no image file has been made.
    status: brief-only-needs-creation-and-review
  - figure_id: CH01-HOMAGE-FIG-003
    caption_zh: 原創虛構餐廳剖面圖標示門窗、畫外聲源與人物聆聽方向；不是電影劇照，圖檔尚未製作。
    caption_en: An original fictional dining-room section diagram marks doors, windows, an offscreen source, and listening directions. It is not a film still; no image file has been made.
    status: brief-only-needs-creation-and-review
  - figure_id: CH01-HOMAGE-FIG-004
    caption_zh: 原創公共走道向量圖以門框與前景遮擋呈現重複路徑；不仿製電影畫面，圖檔尚未製作。
    caption_en: An original public-corridor vector diagram uses a doorway and foreground occlusion to show a repeated path. It does not imitate the film’s imagery; no image file has been made.
    status: brief-only-needs-creation-and-review
  - figure_id: CH01-HOMAGE-FIG-005
    caption_zh: 原創校園走廊向量圖標示人物、玻璃面及可見反射路徑；不使用《一一》劇照，圖檔尚未製作。
    caption_en: An original school-corridor vector diagram marks people, glass, and visible reflection paths. It uses no Yi Yi still; no image file has been made.
    status: brief-only-needs-creation-and-review
