  status: draft
  reviewed_by: null
  reviewed_on: null
- term_id: TERM-CH01-LAYERED-COMPOSITION
  preferred:
    zh-TW: 層次構圖
    en-US: Layered composition
  definitions:
    zh-TW: 透過景深、前後景、反射或遮擋同時安排多組可見資訊；不等同固定鏡頭類型或必然心理效果。
    en-US: Depth, foreground/background, reflections, or occlusion arrange multiple visible information layers;
      this is neither a fixed shot type nor a guaranteed psychological effect.
  domain: composition
  context: CH01 film-homage case studies; draft definition, not approved.
