  status: draft
  reviewed_by: null
  reviewed_on: null
- term_id: TERM-CH01-LONG-TAKE
  preferred:
    zh-TW: 長鏡頭
    en-US: Long take
  definitions:
    zh-TW: 持續時間較長且內部未剪接的單一鏡頭；本詞沒有跨作品通用的秒數門檻。
    en-US: A single uncut shot of comparatively extended duration; there is no universal duration threshold across
      films.
  domain: editing and cinematography
  context: CH01 film-homage case studies; draft definition, not approved.
  synonyms:
    zh-TW: []
    en-US: []
  see_also: []
