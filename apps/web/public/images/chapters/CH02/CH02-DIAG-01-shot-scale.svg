<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Shot scale comparison / 景別比較</title><desc id="desc">Five original line-art framings from wide to close-up; scale labels are illustrative rather than universal.</desc><rect width="1200" height="620" fill="#f4f0e8"/><text x="60" y="70" font-size="32" font-family="sans-serif">景別是主體相對畫框的尺度，不等於焦距</text><text x="60" y="112" font-size="24" font-family="sans-serif">Shot size describes subject scale in frame, not focal length.</text><g stroke="#202629" fill="none" stroke-width="4"><rect x="55" y="175" width="200" height="265"/><rect x="285" y="175" width="200" height="265"/><rect x="515" y="175" width="200" height="265"/><rect x="745" y="175" width="200" height="265"/><rect x="975" y="175" width="170" height="265"/></g><g fill="#bf7654" stroke="#202629" stroke-width="3"><circle cx="155" cy="335" r="15"/><path d="M155 350v45m-23-20h46m-23 20-20 42m20-42 20 42"/><circle cx="385" cy="290" r="21"/><path d="M385 311v68m-34-36h68m-34 36-27 59m27-59 27 59"/><circle cx="615" cy="260" r="27"/><path d="M615 287v97m-43-46h86m-43 46-35 55m35-55 35 55"/><circle cx="845" cy="245" r="36"/><path d="M790 312q55-35 110 0v90h-110z"/><circle cx="1060" cy="265" r="66"/></g><g font-family="sans-serif" font-size="22" fill="#202629" text-anchor="middle"><text x="155" y="485">遠景 / Wide</text><text x="385" y="485">全身景 / Full</text><text x="615" y="485">中景 / Medium</text><text x="845" y="485">中近景 / MCU</text><text x="1060" y="485">特寫 / Close-up</text></g><text x="60" y="565" font-size="19" font-family="sans-serif" fill="#555">示意人物比例；不同劇組的景別邊界略有差異。 / Illustrative proportions; conventions vary.</text></svg>
