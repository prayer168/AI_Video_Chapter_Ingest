<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">Dolly and zoom / 移動攝影機與變焦</title><desc id="desc">A dolly changes camera position and parallax; a zoom changes focal length from the same position.</desc><rect width="1200" height="640" fill="#f4f0e8"/><text x="60" y="65" font-size="32" font-family="sans-serif">Dolly 改變機位；Zoom 改變焦距</text><text x="60" y="105" font-size="23" font-family="sans-serif">Camera translation changes viewpoint; zoom changes angle of view.</text><g stroke="#202629" stroke-width="4" fill="none"><path d="M90 460h470M650 460h460"/><path d="M160 360l90-120 100 120M720 360l90-120 100 120"/></g><g fill="#bf7654" stroke="#202629" stroke-width="3"><rect x="330" y="300" width="40" height="160"/><rect x="935" y="300" width="40" height="160"/></g><g fill="#202629"><path d="M115 400h65l25 25v45h-90z"/><path d="M730 400h65l25 25v45h-90z"/></g><g stroke="#c59b45" stroke-width="5" fill="none"><path d="M180 420L350 320"/><path d="M250 420L350 320"/><path d="M790 420L955 320"/></g><g font-family="sans-serif" font-size="23" fill="#202629"><text x="75" y="520">DOLLY: camera moves forward → visible parallax</text><text x="650" y="520">ZOOM: fixed position → field of view narrows</text></g><text x="60" y="585" font-size="18" font-family="sans-serif">Diagram is schematic; lens/sensor/crop conditions matter. / 光學與感光面條件仍須註明。</text></svg>
