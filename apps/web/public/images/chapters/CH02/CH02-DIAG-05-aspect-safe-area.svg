<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Aspect ratio reframing / 畫面比例與安全構圖</title><desc id="desc">A centered portrait crop inside a 16:9 frame; important subjects remain inside the shared safe area.</desc><rect width="1200" height="620" fill="#f4f0e8"/><text x="55" y="65" font-size="32" font-family="sans-serif">橫式轉直式：先重構圖，再裁切</text><text x="55" y="105" font-size="22" font-family="sans-serif">Reframe for portrait delivery; do not rely on blind cropping.</text><rect x="110" y="155" width="900" height="405" rx="8" fill="#e5ddd0" stroke="#202629" stroke-width="4"/><rect x="425" y="155" width="270" height="405" fill="#bf7654" opacity=".18" stroke="#bf7654" stroke-width="5" stroke-dasharray="12 9"/><rect x="465" y="205" width="190" height="305" fill="none" stroke="#c59b45" stroke-width="4" stroke-dasharray="8 7"/><circle cx="555" cy="310" r="38" fill="#bf7654"/><path d="M555 350v90m-52-48h104m-52 48-38 62m38-62 38 62" stroke="#202629" stroke-width="12"/><text x="130" y="590" font-size="22" font-family="sans-serif">16:9 source</text><text x="450" y="590" font-size="22" font-family="sans-serif">9:16 crop</text><text x="745" y="225" font-size="19" font-family="sans-serif">Keep key action inside</text><text x="745" y="255" font-size="19" font-family="sans-serif">the intended delivery frame.</text><text x="55" y="605" font-size="16" font-family="sans-serif">Platform UI safe zones vary; verify current platform specs separately. / 平台介面安全區須依版本另查。</text></svg>
