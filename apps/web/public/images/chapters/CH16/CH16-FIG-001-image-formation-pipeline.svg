<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Film and digital image formation paths</title><desc id="desc">Two original bilingual process lanes compare film exposure and chemical processing with digital photoelectric conversion, sensor readout, and image processing.</desc>
<defs><style>.bg{fill:#111820}.panel{fill:#1d2a34;stroke:#8da1ad;stroke-width:2}.head{fill:#e8d8b6;font:700 28px sans-serif}.label{fill:#f4f1e9;font:21px sans-serif}.small{fill:#bcc9cf;font:16px sans-serif}.accent{stroke:#d4a45f;stroke-width:4;fill:none;marker-end:url(#arrow)}.box{fill:#273845;stroke:#b99c70;stroke-width:2}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d4a45f"/></marker></defs>
<rect class="bg" width="1400" height="760"/><text x="70" y="62" class="head">影像形成 Image Formation</text><text x="70" y="96" class="small">Original schematic · simplified paths; architectures and workflows vary by medium and camera.</text>
<rect x="55" y="130" width="1290" height="265" rx="20" class="panel"/><text x="85" y="175" class="head">電影底片 Motion-picture film</text>
<g class="box"><rect x="85" y="215" width="210" height="105" rx="12"/><rect x="365" y="215" width="210" height="105" rx="12"/><rect x="645" y="215" width="210" height="105" rx="12"/><rect x="925" y="215" width="160" height="105" rx="12"/><rect x="1150" y="215" width="150" height="105" rx="12"/></g>
<g class="label" text-anchor="middle"><text x="190" y="257"><tspan x="190">場景光／鏡頭</tspan><tspan x="190" dy="28">Scene light / lens</tspan></text><text x="470" y="257"><tspan x="470">乳劑受光</tspan><tspan x="470" dy="28">Emulsion exposure</tspan></text><text x="750" y="257"><tspan x="750">潛影 → 沖洗</tspan><tspan x="750" dy="28">Latent image → process</tspan></text><text x="1005" y="257"><tspan x="1005">負片密度</tspan><tspan x="1005" dy="28">Negative density</tspan></text><text x="1225" y="257"><tspan x="1225">印片／掃描</tspan><tspan x="1225" dy="28">Print / scan</tspan></text></g>
<path d="M300 268H350M580 268H630M860 268H910M1090 268H1135" class="accent"/><text x="85" y="363" class="small">化學反應及處理條件參與形成可讀密度；特性曲線描述曝光與處理後密度，不是數位 Log 訊號。</text>
<rect x="55" y="425" width="1290" height="265" rx="20" class="panel"/><text x="85" y="470" class="head">數位感光元件 Digital image sensor</text>
<g class="box"><rect x="85" y="510" width="180" height="105" rx="12"/><rect x="310" y="510" width="180" height="105" rx="12"/><rect x="535" y="510" width="180" height="105" rx="12"/><rect x="760" y="510" width="180" height="105" rx="12"/><rect x="985" y="510" width="145" height="105" rx="12"/><rect x="1170" y="510" width="150" height="105" rx="12"/></g>
<g class="label" text-anchor="middle"><text x="175" y="550"><tspan x="175">場景光／鏡頭</tspan><tspan x="175" dy="28">Scene light / lens</tspan></text><text x="400" y="550"><tspan x="400">光電轉換</tspan><tspan x="400" dy="28">Photoelectric conversion</tspan></text><text x="625" y="550"><tspan x="625">訊號讀出</tspan><tspan x="625" dy="28">Signal readout</tspan></text><text x="850" y="550"><tspan x="850">A/D 轉換</tspan><tspan x="850" dy="28">A/D conversion</tspan></text><text x="1057" y="550"><tspan x="1057">影像處理</tspan><tspan x="1057" dy="28">Image processing</tspan></text><text x="1245" y="550"><tspan x="1245">記錄／監看</tspan><tspan x="1245" dy="28">Record / monitor</tspan></text></g>
<path d="M270 563H295M495 563H520M720 563H745M945 563H970M1135 563H1155" class="accent"/><text x="85" y="660" class="small">不同感光元件的讀出、解碼、降噪、色彩轉換及編碼可能不同；示意不代表單一標準架構。</text>
</svg>
