<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">導演部門交接圖 / Directing department handoff</title><desc id="desc">A story objective branches into questions for six departments and returns to shared verification.</desc>
<style>text{font-family:Arial,"Noto Sans CJK TC","Microsoft JhengHei",sans-serif;fill:#17212b}.head{font-size:20px;font-weight:700}.dept{font-size:15px;font-weight:700}.sub{font-size:13px}.small{font-size:12px}.box{fill:#f5f1e9;stroke:#364b5c;stroke-width:2}.center{fill:#253e50;stroke:#253e50;stroke-width:2}.centertext{fill:#fff;font-size:18px;font-weight:700}.line{stroke:#8a4f32;stroke-width:2;fill:none}</style>
<text x="60" y="48" class="head">同一故事目標，轉成不同專業能回答的問題 / One story goal, distinct specialist questions</text>
<rect class="center" x="410" y="78" width="380" height="78" rx="16"/><text x="600" y="111" class="centertext" text-anchor="middle">故事目標 / Story objective</text><text x="600" y="139" text-anchor="middle" class="sub" style="fill:#fff">觀眾需要知道、感受或等待什麼？</text>
<path class="line" d="M600 156 V205 M126 205 H1046 M126 205 V238 M310 205 V238 M494 205 V238 M678 205 V238 M862 205 V238 M1046 205 V238"/>
<g><rect class="box" x="42" y="238" width="168" height="168" rx="14"/><text x="126" y="273" text-anchor="middle" class="dept">表演 / Performance</text><text x="126" y="316" text-anchor="middle" class="sub">角色採取什麼行動？</text><text x="126" y="350" text-anchor="middle" class="small">What is</text><text x="126" y="370" text-anchor="middle" class="small">playable?</text></g>
<g><rect class="box" x="226" y="238" width="168" height="168" rx="14"/><text x="310" y="273" text-anchor="middle" class="dept">攝影 / Camera</text><text x="310" y="316" text-anchor="middle" class="sub">觀眾何時得知？</text><text x="310" y="350" text-anchor="middle" class="small">When is it</text><text x="310" y="370" text-anchor="middle" class="small">revealed?</text></g>
<g><rect class="box" x="410" y="238" width="168" height="168" rx="14"/><text x="494" y="273" text-anchor="middle" class="dept">美術 / Design</text><text x="494" y="316" text-anchor="middle" class="sub">空間如何限制行動？</text><text x="494" y="350" text-anchor="middle" class="small">How does space</text><text x="494" y="370" text-anchor="middle" class="small">act?</text></g>
<g><rect class="box" x="594" y="238" width="168" height="168" rx="14"/><text x="678" y="273" text-anchor="middle" class="dept">聲音 / Sound</text><text x="678" y="316" text-anchor="middle" class="sub">什麼能先被聽見？</text><text x="678" y="350" text-anchor="middle" class="small">What can be</text><text x="678" y="370" text-anchor="middle" class="small">heard first?</text></g>
<g><rect class="box" x="778" y="238" width="168" height="168" rx="14"/><text x="862" y="273" text-anchor="middle" class="dept">剪輯 / Editing</text><text x="862" y="316" text-anchor="middle" class="sub">資訊如何排列？</text><text x="862" y="350" text-anchor="middle" class="small">How is information</text><text x="862" y="370" text-anchor="middle" class="small">ordered?</text></g>
<g><rect class="box" x="962" y="238" width="168" height="168" rx="14"/><text x="1046" y="273" text-anchor="middle" class="dept">製片 / Producing</text><text x="1046" y="316" text-anchor="middle" class="sub">時間與資源可行嗎？</text><text x="1046" y="350" text-anchor="middle" class="small">Can schedule</text><text x="1046" y="370" text-anchor="middle" class="small">support it?</text></g>
<path class="line" d="M126 406 V444 H1046 V406 M600 444 V472"/><rect class="center" x="390" y="472" width="420" height="92" rx="14"/><text x="600" y="507" text-anchor="middle" class="centertext">共同驗證 / Shared test</text><text x="600" y="536" text-anchor="middle" class="sub" style="fill:#fff">決策紀錄 / Decision log</text>
</svg>
