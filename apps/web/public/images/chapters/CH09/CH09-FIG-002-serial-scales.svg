<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Story information across episode, season, and series</title><desc id="desc">單集、季與系列的資訊尺度</desc><style>text{font-family:Arial,sans-serif;fill:#242629}.title{font-size:29px;font-weight:700;letter-spacing:1px}.body{font-size:24px;font-weight:600}.small{font-size:19px;fill:#4c5050}.label{font-size:21px;font-weight:700;letter-spacing:2px}</style><rect width="1200" height="600" fill="#f7f3ec"/><path fill="none" d="M130 170H1050M130 310H1050M130 450H1050" stroke="#b8aaa0" stroke-width="3"/><text x="70" y="180" class="label">EPISODE</text><text x="70" y="320" class="label">SEASON</text><text x="70" y="460" class="label">SERIES</text><g fill="#b64f38"><circle cx="220" cy="170" r="18"/><circle cx="500" cy="170" r="18"/><circle cx="780" cy="170" r="18"/><circle cx="350" cy="310" r="18"/><circle cx="900" cy="310" r="18"/><circle cx="250" cy="450" r="18"/><circle cx="650" cy="450" r="18"/><circle cx="1030" cy="450" r="18"/></g><g fill="none" stroke="#b64f38" stroke-width="3" stroke-dasharray="8 8"><path fill="none" d="M220 170L350 310L250 450M500 170L350 310L650 450M780 170L900 310L1030 450"/></g><text x="220" y="125" text-anchor="middle" class="small">local question</text><text x="350" y="265" text-anchor="middle" class="small">season turn</text><text x="650" y="405" text-anchor="middle" class="small">long arc</text><text x="600" y="530" text-anchor="middle" class="small">Resolve a local movement while changing what the larger story means.</text></svg>