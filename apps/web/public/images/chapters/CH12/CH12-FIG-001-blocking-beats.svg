<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Blocking as collaborative scene design</title><desc id="desc">A scene objective is explored through movement beats, marks and eyelines, then tested with the camera and reviewed for safety and editability.</desc><rect width="1200" height="520" fill="#f5f1e9"/><text x="600" y="54" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#18232a">走位是可修訂的場面設計 / Blocking as revisable scene design</text><g font-family="sans-serif" text-anchor="middle"><g fill="#233b43"><rect x="55" y="145" width="220" height="150" rx="12"/><rect x="345" y="145" width="220" height="150" rx="12"/><rect x="635" y="145" width="220" height="150" rx="12"/><rect x="925" y="145" width="220" height="150" rx="12"/></g><g fill="#fff"><text x="165" y="195" font-size="22">戲劇目標</text><text x="165" y="232" font-size="17">Objective</text><text x="455" y="195" font-size="22">動作節拍</text><text x="455" y="232" font-size="17">Movement beats</text><text x="745" y="195" font-size="22">標記與視線</text><text x="745" y="232" font-size="17">Marks &amp; eyelines</text><text x="1035" y="195" font-size="22">攝影／安全測試</text><text x="1035" y="232" font-size="17">Camera &amp; safety test</text></g><g stroke="#bb7545" stroke-width="6" fill="none"><path d="M275 220h60"/><path d="M565 220h60"/><path d="M855 220h60"/></g><g fill="#bb7545"><path d="M330 209l18 11-18 11z"/><path d="M620 209l18 11-18 11z"/><path d="M910 209l18 11-18 11z"/></g></g><path d="M1035 315 C1035 410 165 410 165 315" fill="none" stroke="#627b72" stroke-width="4" stroke-dasharray="10 9"/><text x="600" y="455" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#263c36">排演回饋可修訂選擇｜Rehearsal feedback can revise choices</text></svg>