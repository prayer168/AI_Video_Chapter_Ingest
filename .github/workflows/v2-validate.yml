name: V2 architecture validation
on:
  push:
    paths: ['content/**', 'metadata/**', 'assets/chapters/**', 'scripts/**', 'schemas/**', 'tests/**', 'requirements-v2.txt', '.github/workflows/v2-validate.yml']
  pull_request:
    paths: ['content/**', 'metadata/**', 'assets/chapters/**', 'scripts/**', 'schemas/**', 'tests/**', 'requirements-v2.txt', '.github/workflows/v2-validate.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements-v2.txt
      - run: python scripts/v2_validate.py
      - run: python scripts/publishing/sync_site_content.py
      - run: python scripts/publishing/sync_site_content.py --check
      - run: python -m unittest discover -s tests -p 'test_v2_architecture.py'
