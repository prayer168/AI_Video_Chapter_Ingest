  caption_zh: 圖 9-2｜單集、季與系列可承載不同問題與變化尺度；交叉線表示資訊與角色變化可跨層級回響，不是每部作品都必須採用的公式。本圖為本書原創可編輯
    SVG 示意圖，未使用第三方圖像。
  caption_en: Figure 9-2. Episode, season, and series can carry questions and changes
    at different scales. The crossing lines show how information and character change
    may resonate across levels; they are not a formula every work must follow. This
    is an original editable SVG illustration for this book and uses no third-party
    image.
  alt_zh: 三條水平敘事尺度由單集到系列排列，節點及交叉虛線表示局部事件可能影響較長弧線。
  alt_en: Three horizontal narrative scales run from episode to series; nodes and
    crossing dashed lines show local events potentially affecting longer arcs.
