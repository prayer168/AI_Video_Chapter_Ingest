  caption_zh: 圖 9-3｜事件發生順序與觀眾得知順序可以不同；揭露重排會改變觀眾的假設，但不自動保證懸念或理解。本圖為本書原創可編輯 SVG 示意圖，未使用第三方圖像。
  caption_en: Figure 9-3. The order in which events occur can differ from the order
    in which audiences learn about them. Reordering reveals changes audience hypotheses
    but does not automatically create suspense or clarity. This is an original editable
    SVG illustration for this book and uses no third-party image.
  alt_zh: 上列時間軸依事件因果排列 A、B、C；下列以 B、A、C 呈現，虛線連結對照兩種順序。
  alt_en: The upper timeline orders events causally as A, B, C; the lower reveals
    B, A, C, with dashed connectors comparing the orders.
