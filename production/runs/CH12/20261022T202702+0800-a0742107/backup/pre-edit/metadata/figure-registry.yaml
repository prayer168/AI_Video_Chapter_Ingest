  archive_sha256: 98099da5f231060fe6548afe1238ce2c6000545f250cf47cda9e862670d392ec
  caption_zh: 圖 1-4B｜本圖為原創示意圖，參考《悲情城市》（*A City of Sadness*, 1989）以家庭生活連結公共歷史的討論，安排室內家庭與門外街景並置；並非電影原劇照，也不宣稱是特定歷史事件的寫實重建。街景、人物、服裝及歷史語境均待人工審查。
  caption_en: Figure 1-4B. This is an original illustrative image inspired by discussions of how *A City of Sadness*
    (1989) connects family life with public history, placing a family interior beside a street beyond the doorway.
    It is not an official film still. It does not claim to reconstruct a specific historical event. The street,
    people, costumes, and historical context require human review.
  alt_zh: 老屋室內的一家人圍坐桌邊，左側門外可見雨濕街道、車輛與行人。
  alt_en: A family sits around a table inside an old house; through the doorway at left, a wet street, a vehicle,
    and pedestrians are visible.
